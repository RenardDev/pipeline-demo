# Generated by scripts/generate_workflow.py; edit demo/pipeline.json, then regenerate.
name: Pipeline Observatory · 5 minute demo
run-name: "🎬 Demo #${{ github.run_number }} · ${{ inputs.duration_seconds || 300 }}s · failure=${{ inputs.fail_at || 'none' }}"

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Target duration (runner queues may extend the total runtime)'
        type: choice
        required: true
        default: '300'
        options: ['300', '120', '30']
      fail_at:
        description: 'Inject a demo failure (none for a successful run)'
        type: choice
        required: true
        default: none
        options: [none, unit_api, security_gate, e2e_chromium, canary]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pipeline-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  DEMO_DURATION: ${{ inputs.duration_seconds || '300' }}
  DEMO_FAILURE: ${{ inputs.fail_at || 'none' }}

jobs:
  plan:
    name: '🚦 01 · Plan & release context'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.clock.outputs.started_at }}
    steps:
      - name: 'Start the shared demo clock'
        id: clock
        run: |
          python3 - <<'PY'
          import os, time
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"started_at={time.time()}\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Validate topology and failure-handling scenarios'
        run: |
          python3 scripts/generate_workflow.py --check
          python3 -m unittest discover -s tests -v
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: plan
          started-at: ${{ steps.clock.outputs.started_at }}

  lint:
    name: '🧹 02 · Lint & formatting'
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: lint
          started-at: ${{ needs.plan.outputs.started_at }}

  types:
    name: '🔎 03 · Type contracts'
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: types
          started-at: ${{ needs.plan.outputs.started_at }}

  secrets:
    name: '🔐 04 · Secret scan'
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: secrets
          started-at: ${{ needs.plan.outputs.started_at }}

  dependencies:
    name: '📚 05 · Dependency audit'
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: dependencies
          started-at: ${{ needs.plan.outputs.started_at }}

  infra:
    name: '🏗️ 06 · Infrastructure plan'
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: infra
          started-at: ${{ needs.plan.outputs.started_at }}

  docs:
    name: '📖 07 · Documentation'
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: docs
          started-at: ${{ needs.lint.outputs.started_at }}

  build_web:
    name: '🎨 08 · Build web'
    needs: [lint, types]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: build_web
          started-at: ${{ needs.lint.outputs.started_at || needs.types.outputs.started_at }}

  build_api:
    name: '⚙️ 09 · Build API'
    needs: [types, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: build_api
          started-at: ${{ needs.types.outputs.started_at || needs.dependencies.outputs.started_at }}

  build_worker:
    name: '📨 10 · Build worker'
    needs: [dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: build_worker
          started-at: ${{ needs.dependencies.outputs.started_at }}

  sast:
    name: '🛡️ 11 · Static security'
    needs: [secrets, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: sast
          started-at: ${{ needs.secrets.outputs.started_at || needs.dependencies.outputs.started_at }}

  unit_web:
    name: '🧩 12 · Web unit tests'
    needs: [build_web]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: unit_web
          started-at: ${{ needs.build_web.outputs.started_at }}

  unit_api:
    name: '🧪 13 · API unit tests'
    needs: [build_api]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: unit_api
          started-at: ${{ needs.build_api.outputs.started_at }}

  unit_worker:
    name: '🔁 14 · Worker unit tests'
    needs: [build_worker]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: unit_worker
          started-at: ${{ needs.build_worker.outputs.started_at }}

  container:
    name: '📦 15 · Container assembly'
    needs: [build_web, build_api, build_worker, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: container
          started-at: ${{ needs.build_web.outputs.started_at || needs.build_api.outputs.started_at || needs.build_worker.outputs.started_at || needs.secrets.outputs.started_at }}

  sbom:
    name: '🧾 16 · SBOM & provenance'
    needs: [container]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: sbom
          started-at: ${{ needs.container.outputs.started_at }}

  integration:
    name: '🔗 17 · Integration tests'
    needs: [unit_api, unit_worker, container]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: integration
          started-at: ${{ needs.unit_api.outputs.started_at || needs.unit_worker.outputs.started_at || needs.container.outputs.started_at }}

  e2e_chromium:
    name: '🌐 18 · E2E Chromium'
    needs: [unit_web, container]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: e2e_chromium
          started-at: ${{ needs.unit_web.outputs.started_at || needs.container.outputs.started_at }}

  e2e_firefox:
    name: '🦊 19 · E2E Firefox'
    needs: [unit_web, container]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: e2e_firefox
          started-at: ${{ needs.unit_web.outputs.started_at || needs.container.outputs.started_at }}

  accessibility:
    name: '♿ 20 · Accessibility'
    needs: [build_web]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: accessibility
          started-at: ${{ needs.build_web.outputs.started_at }}

  performance:
    name: '⚡ 21 · Load & performance'
    needs: [integration]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: performance
          started-at: ${{ needs.integration.outputs.started_at }}

  security_gate:
    name: '🚨 22 · Security gate'
    needs: [sast, sbom, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: security_gate
          started-at: ${{ needs.sast.outputs.started_at || needs.sbom.outputs.started_at || needs.infra.outputs.started_at }}

  quality_gate:
    name: '✅ 23 · Quality gate'
    needs: [unit_web, unit_api, unit_worker, integration, e2e_chromium, e2e_firefox, accessibility, performance, security_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: quality_gate
          started-at: ${{ needs.unit_web.outputs.started_at || needs.unit_api.outputs.started_at || needs.unit_worker.outputs.started_at || needs.integration.outputs.started_at || needs.e2e_chromium.outputs.started_at || needs.e2e_firefox.outputs.started_at || needs.accessibility.outputs.started_at || needs.performance.outputs.started_at || needs.security_gate.outputs.started_at }}

  preview:
    name: '🏕️ 24 · Preview environment'
    needs: [quality_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: preview
          started-at: ${{ needs.quality_gate.outputs.started_at }}

  smoke:
    name: '💨 25 · Preview smoke tests'
    needs: [preview]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: smoke
          started-at: ${{ needs.preview.outputs.started_at }}

  canary:
    name: '🐤 26 · Canary rollout 10%'
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: canary
          started-at: ${{ needs.smoke.outputs.started_at }}

  observe:
    name: '📡 27 · Observe canary'
    needs: [canary]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: observe
          started-at: ${{ needs.canary.outputs.started_at }}

  promote:
    name: '🚀 28 · Promote to 100%'
    needs: [observe]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: promote
          started-at: ${{ needs.observe.outputs.started_at }}

  release_notes:
    name: '📝 29 · Release notes'
    needs: [quality_gate, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: release_notes
          started-at: ${{ needs.quality_gate.outputs.started_at || needs.docs.outputs.started_at }}

  rollback:
    name: '🛟 30 · Rollback drill'
    needs: [canary]
    if: ${{ !cancelled() && needs.canary.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: rollback
          started-at: ${{ needs.canary.outputs.started_at }}

  cleanup:
    name: '🧽 31 · Cleanup & audit'
    needs: [plan, preview, promote, rollback]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      started_at: ${{ steps.demo.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Run the three process phases'
        id: demo
        uses: ./.github/actions/demo-stage
        with:
          node: cleanup
          started-at: ${{ needs.plan.outputs.started_at || needs.preview.outputs.started_at || needs.promote.outputs.started_at || needs.rollback.outputs.started_at }}

  report:
    name: '🏁 32 · Mission control report'
    needs: [plan, lint, types, secrets, dependencies, infra, docs, build_web, build_api, build_worker, sast, unit_web, unit_api, unit_worker, container, sbom, integration, e2e_chromium, e2e_firefox, accessibility, performance, security_gate, quality_gate, preview, smoke, canary, observe, promote, release_notes, rollback, cleanup]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Gather all available process artifacts'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: process-*
          path: reports
          merge-multiple: false
      - name: 'Build mission control dashboard & workflow summary'
        if: ${{ !cancelled() }}
        env:
          DEMO_STARTED_AT: ${{ needs.plan.outputs.started_at }}
          DEMO_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/demo_pipeline.py report
      - name: 'Publish graph, timeline and full evidence'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mission-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
